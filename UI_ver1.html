<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0e0e0f">
<title>야구 팬덤 대결</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@125,900&family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0e0e0f;--surface:#1c1c1e;--surface2:#2c2c2e;--text:#f5f5f7;--body:#c7c7cc;--sub:#98989d;--muted:#7c7c80;--faint:#48484a;--line:#2c2c2e;
  --p:#c30452;--pBg:#410b22;--pText:#d54f86;--o:#4e4cc8;--oBg:#201f43;--oText:#8382d8;--ok:#34c759;--err:#ff6961;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{background:#060607;color:var(--text);font-family:"Noto Sans KR",-apple-system,"Apple SD Gothic Neo",sans-serif;-webkit-font-smoothing:antialiased;overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
button:disabled{cursor:default}
input{font:inherit;color:inherit}
.num{font-family:"Archivo","SF Pro Display",-apple-system,sans-serif;font-weight:900;font-stretch:125%;letter-spacing:-.01em}
.sf{font-family:-apple-system,"SF Pro Text","Noto Sans KR",sans-serif}

/* stage */
.stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;gap:48px}
.holder{position:relative;flex:none}
.phone{position:absolute;left:0;top:0;width:390px;height:844px;background:var(--bg);border-radius:48px;overflow:hidden;transform-origin:top left;box-shadow:0 0 0 10px #18181a,0 0 0 11px #2e2e30,0 40px 100px rgba(0,0,0,.7)}
body.mobile .phone{border-radius:0;box-shadow:none}
body.mobile .stage{gap:0}
body.mobile .side{display:none}
.side{width:300px;color:var(--body);font-size:13px;line-height:1.7}
.side h1{font-size:22px;font-weight:900;color:var(--text);letter-spacing:-.02em}
.side p{color:var(--sub);margin-top:6px}
.side .grp{margin-top:22px}
.side .gt{font-size:11px;font-weight:700;color:var(--muted);letter-spacing:.06em;margin-bottom:8px}
.side .demo{display:flex;flex-wrap:wrap;gap:8px}
.side .demo button{font-size:12.5px;font-weight:700;color:var(--text);background:var(--surface);border:1px solid #333;border-radius:999px;padding:8px 12px}
.side .demo button:hover{border-color:var(--p)}
.side ul{list-style:none;color:var(--sub)}
.side li::before{content:"· "}

/* absolute layer helpers */
#phone > *{position:absolute}
#phone > .modal *{position:absolute}
#phone > .modal .st{position:static}
.scr,.ov{position:absolute;inset:0}
#phone.still > .scr.in, #phone.still .scr .pop, #phone.still .scr .in{animation:none}
#phone.stillov > :not(.scr), #phone.stillov > :not(.scr) .pop{animation:none}
.scr *, .ov *{position:absolute}
.scr .st, .ov .st{position:static}
.in{animation:in .32s cubic-bezier(.2,.8,.2,1)}
@keyframes in{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.pop{animation:pop .5s cubic-bezier(.2,1.4,.4,1)}
@keyframes pop{from{opacity:0;transform:scale(.7)}to{opacity:1;transform:none}}
.fadein{animation:fadein .25s ease}
@keyframes fadein{from{opacity:0}to{opacity:1}}
.sheet-in{animation:sheet .38s cubic-bezier(.2,.9,.25,1)}
@keyframes sheet{from{transform:translateY(100%)}to{transform:none}}
.spin{animation:spin 40s linear infinite;transform-origin:50% 50%}
@keyframes spin{to{transform:rotate(360deg)}}
.wob{animation:wob 2.4s ease-in-out infinite}
@keyframes wob{0%,100%{transform:translateY(0) rotate(-6deg)}50%{transform:translateY(-12px) rotate(6deg)}}
.pulse{animation:pulse 1s ease-in-out infinite}
@keyframes pulse{50%{opacity:.55}}
.shake{animation:shake .4s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}

.glass{background:rgba(28,28,30,.62);border:1px solid rgba(255,255,255,.12);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px)}
.btn{display:flex;align-items:center;justify-content:center;font-weight:700;transition:transform .1s,opacity .2s}
.btn:active:not(:disabled){transform:scale(.97)}
.btn:disabled{opacity:.4}
.btn.p{background:var(--p);color:#fff}
.btn.w{background:var(--text);color:#111}
.btn.g{background:var(--surface2);color:var(--text)}
.link{color:var(--sub);font-weight:500;font-size:14px;text-align:center}
.av{border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;color:var(--text);overflow:hidden}
.ctr{left:0;right:0;text-align:center}
.t-title{font-weight:900;letter-spacing:-.04em}

/* status bar */
.sb-t{left:40px;top:14px;font-size:17px;font-weight:600}
.sb-i{left:132px;top:11px;width:126px;height:37px;border-radius:19px;background:#000;z-index:50}
.home-ind{left:128px;top:830px;width:134px;height:5px;border-radius:3px;background:var(--text);z-index:50}

/* setup */
.inp{left:112px;top:190px;width:254px;height:52px;border-radius:14px;background:var(--surface);border:1.5px solid var(--p)}
.inp input{position:absolute;left:16px;top:0;width:180px;height:100%;background:transparent;border:0;outline:none;font-size:17px;font-weight:700}
.row-team{border-radius:16px}
.sel-row{background:color-mix(in srgb,var(--p) 14%,transparent);outline:1.5px solid var(--p)}

/* scroll areas */
.scroll{overflow-y:auto;overflow-x:hidden;scrollbar-width:none}
.scroll::-webkit-scrollbar{display:none}
.hscroll{overflow-x:auto;overflow-y:hidden;white-space:nowrap;scrollbar-width:none}
.hscroll::-webkit-scrollbar{display:none}
.hscroll > *, .hscroll > .chip{position:relative;display:inline-flex;vertical-align:top}

.chip{height:38px;border-radius:19px;padding:0 14px;display:flex;align-items:center;font-size:14px;font-weight:700;background:var(--surface);border:1.5px solid var(--line);color:var(--body);white-space:nowrap}
.chip.on{background:var(--text);border-color:var(--text);color:var(--p)}
.ecard{width:114px;height:102px;border-radius:22px;background:var(--surface);border:1.5px solid var(--line);transition:transform .1s}
.ecard:active{transform:scale(.96)}
.ecard.on{border:3px solid var(--p)}
.ecard .e{left:0;right:0;top:8px;text-align:center;font-size:34px;line-height:44px}
.ecard .n{left:0;right:0;top:56px;text-align:center;font-size:13px;font-weight:700}
.ecard .c{left:0;right:0;top:76px;text-align:center;font-size:12px;color:var(--sub);font-weight:600}

.vote{width:166px;height:72px;border-radius:20px;background:var(--surface);border:1.5px solid var(--line);transition:opacity .25s,background .25s,transform .1s}
.vote:active:not(:disabled){transform:scale(.97)}
.vote .l{left:0;right:0;top:11px;text-align:center;font-size:18px;font-weight:700}
.vote .s{left:0;right:0;top:41px;text-align:center;font-size:13px;color:var(--sub);font-weight:600}
.vote.sel{background:var(--text);border-color:var(--text)}
.vote.sel .l{color:var(--p)}
.vote.sel .s{color:#111}
.vote.dim{opacity:.3}

.tab{width:90px;height:68px}
.tab .i{left:34px;top:10px;width:22px;height:22px;border-radius:50%;background:var(--faint);display:flex;align-items:center;justify-content:center;font-size:12px}
.tab .lb{left:0;right:0;top:38px;text-align:center;font-size:11px;font-weight:500;color:var(--sub)}
.tab.on .i{background:var(--p)}
.tab.on .lb{color:var(--text)}

.toast{left:24px;right:24px;top:676px;z-index:80;border-radius:18px;padding:12px 16px;font-size:14px;font-weight:700;display:flex;gap:10px;align-items:center}
.toast *{position:static}
.banner{left:16px;right:16px;top:56px;z-index:70;border-radius:20px;padding:10px 14px;display:flex;align-items:center;gap:12px;cursor:pointer}
.banner *{position:static}
</style>
</head>
<body>
<div class="stage">

    </div>
  </aside>
</div>

<script>
(() => {
/* ================= data ================= */
const BURST = "M 0 0.00 C 0 0.00 93.77 59.14 119.52 49.01 C 145.27 38.88 170.68 0.00 170.68 0.00 C 170.68 0.00 177.12 57.10 200.44 60.39 C 223.75 63.68 246.83 21.88 246.83 21.88 C 246.83 21.88 254.00 32.25 260.83 35.88 C 267.66 39.51 310 -0.00 310 -0.00 C 310 -0.00 252.08 87.52 260.83 118.16 C 269.58 148.79 309.99 153.93 309.99 153.93 C 309.99 153.93 249.56 154.30 246.83 175.93 C 244.10 197.56 283.59 217.94 283.59 217.94 C 283.59 217.94 272.25 233.40 269.58 245.00 C 266.92 256.59 309.99 316.69 309.99 316.69 C 309.99 316.69 222.32 245.00 186.43 255.58 C 150.54 266.16 140.92 308.10 140.92 308.10 C 140.92 308.10 144.29 252.96 119.52 245.00 C 94.75 237.03 65.59 288.84 65.59 288.84 C 65.59 288.84 59.55 276.12 52.51 271.26 C 45.47 266.39 0 308.10 0 308.10 C 0 308.10 65.60 201.32 52.51 183.81 C 39.43 166.29 5.17 153.93 5.17 153.93 C 5.17 153.93 67.39 141.19 65.59 122.46 C 63.78 103.72 30.63 89.27 30.63 89.27 C 30.63 89.27 40.59 77.98 43.76 69.14 C 46.93 60.31 0 0.00 0 0.00 Z";

/* ================= screens ================= */
function scrStart(){

let lastScr=null, lastOv=null, waitT=null;
function render(){
  const ovKey = [S.sheet, !!S.recv, !!S.banner, S.toast].join("|");
  phone.classList.toggle("still", lastScr===S.screen);
  phone.classList.toggle("stillov", lastOv===ovKey);
  lastScr=S.screen; lastOv=ovKey;
  if (S.screen==="room" && S.phase==="waiting" && !S.sheet && !S.recv && !waitT) waitT=setTimeout(()=>{ waitT=null; if(S.screen==="room"&&S.phase==="waiting"&&!S.sheet&&!S.recv) nextBat(); }, 1800);
  theme(S.screen==="setup" ? S.draftTeam : S.team);
  const scr = {start:scrStart, setup:scrSetup, home:scrHome, room:scrRoom, result:scrResult, card:scrCard, sent:scrSent, end:scrEnd, share:scrShare}[S.screen]();
  let ov = "";
  if (S.sheet==="team") ov += sheetTeam();
  if (S.sheet==="howto") ov += sheetHowto();
  if (S.sheet==="counter") ov += sheetCounter();
  if (S.sheet==="confirm") ov += modalConfirm();
  if (S.recv) ov += ovRecv();
  if (S.banner && !S.recv) ov += `<div class="banner glass in" data-act="openBanner" style="background:rgba(28,28,30,.9)">
      <span style="font-size:30px">${S.banner.e}</span>
      <span style="flex:1;min-width:0"><span style="display:block;font-size:12px;color:var(--oText);font-weight:700">${esc(S.banner.from)} · ${opp().s} 팬의 도발</span><span style="display:block;font-size:14px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">“${esc(S.banner.q)}”</span></span>
      <span style="font-size:12px;color:var(--sub)">보기 ›</span></div>`;
  if (S.toast) ov += `<div class="toast glass in" style="background:rgba(28,28,30,.92)">${S.toast}</div>`;
  phone.innerHTML = scr + ov;
  bindInputs();
}
function bindInputs(){
  const n = document.getElementById("nick");
  if (n) n.oninput = () => {
    S.nick = n.value;
    const ok = nickOk(S.nick);
    document.getElementById("cnt").textContent = `${[...S.nick].length}/10`;
    const m = document.getElementById("nmsg");
    m.textContent = ok ? "✓ 사용 가능한 닉네임이에요" : "닉네임은 2~10자로 입력해 주세요";
    m.style.color = ok ? "var(--ok)" : "var(--err)";
    document.getElementById("inpbox").style.borderColor = ok ? "var(--p)" : "var(--err)";
    document.getElementById("enter").disabled = !ok;
    document.getElementById("prog").style.width = (ok?342:228)+"px";
  };
  if (n) n.onkeydown = e => { if (e.key==="Enter" && nickOk(S.nick)) act("enter"); };
  const q = document.getElementById("tq");
  if (q) q.oninput = () => { S.sheetQuery = q.value; const pos=q.selectionStart; render(); const q2=document.getElementById("tq"); q2.focus(); q2.setSelectionRange(pos,pos); };
}

let toastT;
function toast(msg, ms=1800){ S.toast = msg; render(); clearTimeout(toastT); toastT = setTimeout(()=>{ S.toast=null; render(); }, ms); }
function go(screen, opts={}){ S.prev = S.screen; S.screen = screen; S.sheet = opts.sheet ?? null; Object.assign(S, opts.set||{}); render(); }

/* ================= game loop ================= */
let tickT=null, phaseT=null, recvT=null, sentT=null;
function startAtBat(){
  clearTimeout(phaseT);
  S.phase="open"; S.left=VOTE_SEC; S.pick=null; S.ratio=null; S.friends=null; S.started=false;
  S.count = 190 + Math.floor(Math.random()*50);
  ensureTick();
}
function ensureTick(){
  if (tickT) return;
  tickT = setInterval(() => {
    if (S.screen!=="room" || S.sheet==="confirm" || S.recv) return;
    if (S.phase==="open" || S.phase==="picked"){
      S.left--; S.count += Math.floor(Math.random()*4);
      if (S.left<=0) lock(); else softRender();
    }
  }, 1000);
}
function softRender(){ if (S.screen==="room") { S.started=true; render(); } }
function lock(){
  const b = B();
  if (!S.pick){
    S.phase="missed"; render();
    applyRuns(b);
    phaseT = setTimeout(()=>nextBat(), 3200);
    return;
  }
  S.phase="locked";
  S.ratio = 45 + Math.floor(Math.random()*30);
  S.friends = ["준","서","도"].map(()=> Math.random()<.5?"출루":"아웃");
  render();
  phaseT = setTimeout(()=>reveal(), 2400);
}
function applyRuns(b){ if (b.runs) for (const k in b.runs) S.score[k]+=b.runs[k]; }
function reveal(){
  const b = B();
  const win = (S.pick==="safe") === b.safe;
  S.stats.tries++;
  const before = S.points;
  if (win){ S.points += REWARD; S.stats.hits++; S.stats.earned += REWARD; if (!S.stats.hero) S.stats.hero = b.name; }
  applyRuns(b);
  S.last = {win, before, batter:b.name, result:b.result, safe:b.safe, pick:S.pick, tip:b.tip};
  S.phase="waiting"; S.preview=false;
  go("result");
  if (!win) scheduleRecv(5500);
}
function nextBat(){
  clearTimeout(phaseT);
  S.i++;
  if (S.i >= BATTERS.length){ S.i = BATTERS.length-1; S.recordMode=false; S.phase=null; go("end"); return; }
  startAtBat();
  if (S.screen!=="room") go("room"); else render();
}
function scheduleRecv(ms){
  clearTimeout(recvT);
  recvT = setTimeout(()=>incoming(), ms);
}
function incoming(){
  if (!["room","home","result","card"].includes(S.screen) || S.recv || S.sheet) { scheduleRecv(4000); return; }
  const f = fans()[Math.floor(Math.random()*2)];
  const c = CARDS[1+Math.floor(Math.random()*(CARDS.length-1))];
  const r = {from:f.n, e:c.e, q:c.q};
  S.stats.recv++;
  if (S.screen==="room" && S.phase==="open"){ S.banner = r; render(); setTimeout(()=>{ if (S.banner===r){ S.banner=null; render(); } }, 6000); }
  else { S.recv = r; render(); }
}

/* ================= actions ================= */
function act(a, el){
  const d = el ? el.dataset : {};
  switch(a){
    case "toStart": go("start"); break;
    case "toSetup": S.draftTeam=S.team; go("setup"); break;
    case "randNick": { let n; do { n = RANDOM_NICKS[Math.floor(Math.random()*RANDOM_NICKS.length)]; } while(n===S.nick); S.nick=n; render(); break; }
    case "pickPhoto": document.getElementById("file").click(); break;
    case "openTeam": S.sheetQuery=""; S.sheet="team"; render(); break;
    case "selTeam": S.draftTeam=d.k; render(); break;
    case "closeSheet": S.sheet=null; render(); break;
    case "enter": if(!nickOk(S.nick)) return; S.nick=S.nick.trim(); S.team=S.draftTeam; go("home"); toast(`${my().s} 진영으로 참전 완료 ⚾`); break;
    case "toHome": go("home"); break;
    case "howto": S.sheet="howto"; render(); break;
    case "toRoom": S.preview=false; S.recordMode=false; S.sheet=null; if(!S.phase){ startAtBat(); } go("room"); break;
    case "toRoomClose": S.sheet=null; act("toRoom"); break;
    case "previewWin": S.last={win:true,before:S.points,batter:"김거포",result:"볼넷",safe:true,pick:"safe",tip:BATTERS[0].tip}; go("result",{set:{preview:true}}); break;
    case "vote": if (S.phase!=="open") return; S.pick=d.k; S.phase="picked"; S.count++; render(); break;
    case "toCard": S.sheet=null; S.recv=null; if (S.screen!=="card") S.backTo=S.screen; go("card"); break;
    case "tauntFan": S.target=+d.i+1; act("toCard"); break;
    case "back": {
      const dest = S.backTo || "home";
      go(dest);
      if (dest==="room"){ if(!S.phase) startAtBat(); }
      break;
    }
    case "target": S.target=+d.i; render(); break;
    case "card": S.card=+d.i; S.phrase=null; render(); break;
    case "phrase": S.phrase=d.p; render(); break;
    case "confirm": S.sheet="confirm"; render(); break;
    case "needPoints": toast("포인트가 부족해요 · 예측을 맞혀 100P를 모아요"); document.querySelector('[data-act="needPoints"]')?.classList.add("shake"); break;
    case "send": {
      S.points -= COST; S.stats.sent++;
      S.sentTo = S.target===0 ? fans()[Math.floor(Math.random()*2)].n : fans()[S.target-1].n;
      S.sentRead=false; S.closeIn=3; S.sheet=null;
      go("sent");
      clearInterval(sentT);
      setTimeout(()=>{ if(S.screen==="sent"){ S.sentRead=true; render(); } }, 1300);
      sentT = setInterval(()=>{ if(S.screen!=="sent"){ clearInterval(sentT); return; } S.closeIn--; if(S.closeIn<=0){ clearInterval(sentT); act("afterSent"); } else render(); }, 1000);
      scheduleRecv(7000);
      break;
    }
    case "afterSent": clearInterval(sentT); if (S.phase==="waiting" || !S.phase) nextBat(); else go("room"); break;
    case "counter": S.recv=null; S.banner=null; if (S.screen!=="room"){ if(!S.phase) startAtBat(); S.screen="room"; } S.sheet="counter"; render(); break;
    case "closeRecv": S.recv=null; render(); break;
    case "openBanner": S.recv=S.banner; S.banner=null; render(); break;
    case "nextBat": nextBat(); break;
    case "explain": toast(`💡 ${S.last.tip}`, 3200); break;
    case "toShare": if (S.screen!=="share") S.backTo=S.screen; go("share"); break;
    case "toRecord": S.backTo=S.screen; S.recordMode=true; go("end"); break;
    case "copyLink": {
      const text = `${S.nick}님의 도전장! 야구 팬덤 대결에서 ${my().s} vs ${opp().s} 같이 붙어요 ⚾`;
      try { navigator.clipboard?.writeText(text + " " + location.href); } catch(e){}
      toast("🔗 초대 링크를 복사했어요");
      break;
    }
    case "replay": resetGame(); go("home"); toast("새 경기를 준비했어요"); break;
  }
}
function resetGame(){
  clearTimeout(phaseT); clearTimeout(recvT);
  Object.assign(S, {score:{lg:2,doosan:1}, i:0, phase:null, pick:null, ratio:null, friends:null, stats:{hits:0,tries:0,earned:0,sent:0,recv:0,hero:null}, recordMode:false});
}

phone.addEventListener("click", e => {
  const el = e.target.closest("[data-act]");
  if (!el || el.disabled) return;
  if (el.classList.contains("ov") && e.target !== el) return; // backdrop only
  act(el.dataset.act, el);
});
document.getElementById("file").onchange = e => {
  const f = e.target.files[0]; if (!f) return;
  const r = new FileReader(); r.onload = () => { S.avatar = r.result; render(); }; r.readAsDataURL(f);
};
document.querySelectorAll("[data-demo]").forEach(b => b.onclick = () => {
  const k = b.dataset.demo;
  if (k==="reset"){ clearTimeout(phaseT); clearTimeout(recvT); S = fresh(); render(); return; }
  if (S.screen==="start"||S.screen==="setup"){ S.team=S.draftTeam; }
  if (k==="skip"){ S.recv=null; S.sheet=null; if(!S.phase) { startAtBat(); go("room"); } else if (S.phase==="open"||S.phase==="picked"){ if(!S.pick){ S.pick=Math.random()<.5?"safe":"out"; } S.left=0; if(S.screen!=="room") go("room"); lock(); } else nextBat(); }
  if (k==="taunt"){ S.sheet=null; clearTimeout(recvT); if(S.screen==="start"||S.screen==="setup") go("home"); const f=fans()[0]; S.stats.recv++; S.recv={from:f.n,e:"🐢",q:"주루가 거북이네~"}; render(); }
  if (k==="charge"){ S.points+=300; toast("+300P 충전 (데모)"); }
  if (k==="end"){ clearTimeout(phaseT); S.i=BATTERS.length-1; S.phase=null; S.recordMode=false; S.sheet=null; S.recv=null; go("end"); }
});

/* ================= fit ================= */
const holder = document.getElementById("holder");
function fit(){
  const mobile = window.innerWidth <= 600;
  document.body.classList.toggle("mobile", mobile);
  const s = mobile ? Math.min(window.innerWidth/390, window.innerHeight/844) : Math.min(1, (window.innerHeight-48)/844);
  phone.style.transform = `scale(${s})`;
  holder.style.width = 390*s+"px"; holder.style.height = 844*s+"px";
}
window.addEventListener("resize", fit); fit();
render();
})();
</script>
